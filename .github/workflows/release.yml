name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f dist/styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      LICENSE
                      THIRD_PARTY_NOTICES.md
                      POKEMON_CARDS_CSS_LICENSE
                      OBSIDIAN_MAPS_LICENSE
                      MAPLIBRE_LICENSE
                      ${{ steps.styles.outputs.exists == 'true' && 'dist/styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    dist/main.js dist/manifest.json \
                    LICENSE THIRD_PARTY_NOTICES.md \
                    POKEMON_CARDS_CSS_LICENSE \
                    OBSIDIAN_MAPS_LICENSE MAPLIBRE_LICENSE \
                    ${{ steps.styles.outputs.exists == 'true' && 'dist/styles.css' || '' }}
